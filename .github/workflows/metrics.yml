# Ubicación en tu repo de perfil (slaiton/slaiton): .github/workflows/metrics.yml
#
# Requisito previo: token CLASSIC (ghp_...) guardado como secreto METRICS_TOKEN.
#   - Sin scopes            -> solo repos públicos propios
#   - Con scope `repo`      -> incluye repos privados y donde eres colaborador
#   - Con scope `read:org`  -> incluye repos de organizaciones a las que perteneces

name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"   # diario, 06:00 UTC (01:00 en Colombia)
  workflow_dispatch:       # ejecución manual desde la pestaña Actions

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generar métricas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: slaiton
          filename: github-metrics.svg
          template: classic
          base: header, activity, repositories, metadata
          config_timezone: America/Bogota

          # ─── Ampliar el alcance más allá de tus propios repos ───────────────
          # owner                -> repos que te pertenecen
          # collaborator         -> repos ajenos donde te dieron acceso
          # organization_member  -> repos de organizaciones donde eres miembro
          repositories_affiliations: owner, collaborator, organization_member

          # ─── Lenguajes ──────────────────────────────────────────────────────
          # "most-used"    analiza el contenido de los repos del alcance de arriba
          # "recently-used" analiza TUS commits recientes en cualquier repo,
          #                 sea tuyo o no, leyendo tu historial de eventos
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_recent_days: 0          # 0 = sin límite de antigüedad
          plugin_languages_recent_load: 400        # cuántos eventos revisar
          plugin_languages_recent_categories: programming
          plugin_languages_analysis_timeout: 15    # minutos, corta si se alarga

          # ─── Calendario de contribuciones ───────────────────────────────────
          # Refleja el mismo conteo que muestra tu perfil de GitHub:
          # incluye commits en repos ajenos y privados (ver notas más abajo)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ─── Hábitos de commit (basado en actividad reciente, sea donde sea) ─
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: no
