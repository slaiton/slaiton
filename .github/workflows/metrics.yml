# Ubicación en tu repo de perfil (slaiton/slaiton):
# .github/workflows/metrics.yml

name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"   # Diario, 06:00 UTC (01:00 en Colombia)

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generar métricas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: slaiton
          filename: github-metrics.svg
          template: classic
          base: header, activity, repositories, metadata
          config_timezone: America/Bogota

          # ─── Repositorios incluidos ────────────────────────────────────────
          #
          # owner                -> repositorios propios
          # collaborator         -> repositorios ajenos donde colaboras
          # organization_member  -> repositorios de organizaciones donde eres miembro
          #
          # El token METRICS_TOKEN debe tener acceso a los repositorios privados.
          repositories: 1000
          repositories_batch: 100
          
          repositories_affiliations: owner, collaborator, organization_member

          # ─── Lenguajes ──────────────────────────────────────────────────────
          #
          # "most-used" analiza el código de los repositorios incluidos arriba.
          # Al incluir owner/collaborator/organization_member y usar un token
          # con acceso a privados, también puede analizar tus repos privados.
          #
          # recently-used se mantiene desactivado porque estaba provocando
          # el error del analyzer "committer".
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_analysis_timeout: 15

          # ─── Calendario de contribuciones ───────────────────────────────────
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ─── Hábitos de commit ──────────────────────────────────────────────
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: no